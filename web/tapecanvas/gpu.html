<!doctype html>
<meta charset="utf-8">
<title>MvC2 owned tape render — gpu.html (stage + bodies + full HUD + effects)</title>
<!--
  OWNED RENDER — full-treatment harness. tape (0.3.29) -> tape-adapter -> SpriteClient
  (EMITTER path, the validated 0.00px buildEmitterDrawList) -> SpriteGPU (WebGPU, native
  640x480, NEAREST), + the VENDORED full HUD (hud-client.mjs: DM01 portraits, angled life
  bars, roster names, TIME, super meters, combo) + the 2D stage backdrop (stage-client.mjs)
  + victim hit-flash + the effect garble-guard. All renderer modules live in ./renderer/
  (vendored — no maplecast dependency); the tape adapter + this glue are the harness.

  SERVING: static-serve this dir (or the repo root), e.g.:
      python -m http.server 8779   # from mvc-live-skins-quarters/web/tapecanvas
  then open  gpu.html
  Knobs: ?tape=<url> ?atlas=<url> ?renderer=<url> ?stage=<N> ?frame=<N>

  EFFECTS: 0.3.29 objs (20-byte: owner + gfx1/gfx2) render sprite-class cat1-4 through the
  emitter. The garble-guard suppresses offline-decode banded effect cells (Cable-plasma fix;
  real fix = re-rip PL17 with live PARTDUMP --realparts). STAGE: the tape's stage_id (Steam
  blk+0x6D3C, forwarded by tape_to_gpujson.py) selects stages/STG<xx>_bg.png — a first-pass
  2D-flatten of the POL/TEX rip, scrolled by camX/camY behind the bodies (stage-client.mjs).
-->

<style>
  html,body{margin:0;background:#0a0c10;color:#c9d3df;font:13px/1.4 system-ui,sans-serif}
  #stage{position:relative;width:640px;height:480px;margin:10px auto;background:#181a20;
         box-shadow:0 0 0 1px #2a2f3a}
  #stage canvas{position:absolute;left:0;top:0;width:640px;height:480px;image-rendering:pixelated}
  #hud{pointer-events:none}
  #bar{max-width:660px;margin:8px auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #bar button,#bar label{background:#1b2029;border:1px solid #333c49;color:#c9d3df;
         padding:4px 8px;border-radius:4px}
  #scrub{flex:1;min-width:300px}
  #log{max-width:660px;margin:8px auto;white-space:pre-wrap;font-family:ui-monospace,monospace;
       font-size:12px;color:#8aa0b6;max-height:180px;overflow:auto;border:1px solid #222a34;padding:6px}
  .tag{color:#ffd24d}
</style>

<div id="stage">
  <canvas id="cstage" width="640" height="480"></canvas>
  <canvas id="cbody" width="640" height="480"></canvas>
  <canvas id="hud"   width="640" height="480"></canvas>
</div>
<div id="bar">
  <button id="play">▶ play</button>
  <label>frame <input id="scrub" type="range" min="0" max="0" value="600"></label>
  <span id="fno" class="tag">—</span>
  <label>speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select></label>
  <label><input type="checkbox" id="fx" checked> effects</label>
  <label><input type="checkbox" id="hitflash" checked> hit-flash</label>
  <button id="shot">save PNG</button>
</div>
<div id="log"></div>

<script type="module">
const qs = new URLSearchParams(location.search);
// Module + atlas roots. Default assumes a static server at the projects root serving both repos.
const RENDERER = qs.get('renderer') || './renderer';   // VENDORED own copy (patched for Steam tape) — no maplecast repo dependency
const ATLAS    = qs.get('atlas')    || '/maplecast-flycast/web/test-atlas/chars';
const TAPE     = qs.get('tape')     || './tape.json';
const START    = +(qs.get('frame') || 600);

const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

let SpriteClient, SpriteGPU, TapeAdapter, loadTapeJson, HudClient, StageClient;
try {
  const V = '?v=diag1';   // bump on any renderer/adapter module change (browser cache-bust) — 2026-08-29 run-based draw + per-object layer z (defects #1+#2) + no-route diagnostic
  ({ SpriteClient } = await import(`${RENDERER}/sprite-client.mjs${V}`));
  ({ SpriteGPU }    = await import(`${RENDERER}/sprite-gpu.mjs${V}`));
  ({ HudClient }    = await import(`${RENDERER}/hud-client.mjs${V}`));
  ({ StageClient }  = await import(`${RENDERER}/stage-client.mjs${V}`));
  ({ TapeAdapter, loadTapeJson } = await import(`./tape-adapter.mjs${V}`));
} catch (e) { log('module import FAILED: ' + e.message + '\n  set ?renderer=<url> to your maplecast web/webgpu path'); throw e; }

// ── WebGPU device + renderer ──────────────────────────────────────────────────
const cstage = document.getElementById('cstage');
const sctx   = cstage.getContext('2d');
const cbody = document.getElementById('cbody');
const hud   = document.getElementById('hud');
const hctx  = hud.getContext('2d');

// full HUD (portraits + angled bars + names + TIME + meters + combo) & 2D stage backdrop
// ⚠ base MUST be absolute — `new URL(relative, './hud/')` THROWS (base must be absolute), the throw is
// swallowed by the loader's try/catch → portraits/frame silently null → monogram/blank fallback on EVERY
// live render (the S/M/C-monogram bug). Build an absolute base from import.meta.url.
const HUD = new HudClient(new URL('./hud/', import.meta.url).href);       window._hud = HUD;
const STAGE = new StageClient(new URL('./stages/', import.meta.url).href); window._stage = STAGE;
await HUD.load();

const SC = new SpriteClient(); window._sc = SC;
const SG = new SpriteGPU();    window._sg = SG;
SC.assemblyMode = true;          // EMITTER (parts) path — the validated body renderer
window._emitterPort = true;      // faithful loc_8c033e90 emitter port
window._emitZByLayer = true;     // draw_layer group sort (spec §4) — NO engZ on the tape
SC.predict = false;              // frozen tape frame — no extrapolation
SC.objectsOn = false;            // effects/satellites gated OFF (default)
SC.hitFlashOn = true;            // victim hit-flash (render-only; tint driven by tape hitstun)
window._fxGarbleGuard = true;    // suppress offline-decode banded effect cells (Cable plasma fix)
SC.setCharBase(ATLAS);           // lazy per-char PLxx_parts.png/_asm.json fetch

let gpuOK = false, device = null;
try {
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice();
  // 'premultiplied' = transparent clear, so the 2D stage backdrop (cstage, behind) shows
  // through wherever no body/effect pixel is drawn. #stage bg (#181a20) fills the no-stage case.
  gpuOK = SG.init(device, cbody, 'premultiplied');
  // Route the HUD through the REAL pvr2 rasterizer on the SAME device (renderer/hud-pvr2.mjs).
  // The HUD renders to its own offscreen RT (no canvas conflict with the body swap-chain).
  if (device) HUD.initGpu(device);
  log(gpuOK ? 'WebGPU ready' : 'WebGPU init failed — bodies will not draw');
} catch (e) { log('no WebGPU: ' + e.message); }

// ── tape ──────────────────────────────────────────────────────────────────────
const AD = await loadTapeJson(TAPE); window._ad = AD;
log(`tape loaded: ${AD.frameCount} frames, p1=${JSON.stringify(AD.p1_team)} p2=${JSON.stringify(AD.p2_team)} costume=${JSON.stringify(AD.costume)}`);
const scrub = document.getElementById('scrub');
scrub.max = AD.frameCount - 1; scrub.value = Math.min(START, AD.frameCount - 1);

// STAGE backdrop: stage_id from the tape header (forwarded by tape_to_gpujson.py from Steam
// blk+0x6D3C; this tape = 0 -> STG00 Airship Day) or the ?stage=N harness knob. setStage
// lazy-loads STGxx_bg.png + STGxx.json (404 => render() is a no-op, bodies on black).
const STAGE_ID = (qs.get('stage') != null) ? +qs.get('stage')
               : (AD.stage_id != null ? +AD.stage_id : -1);
if (STAGE_ID >= 0) { STAGE.setStage(STAGE_ID).then(ok =>
  log(`stage_id ${STAGE_ID} -> STG${STAGE.hexIdx()} ${ok ? 'backdrop loaded' : 'no backdrop asset (blocked-on-asset)'}`)); }
else { log('stage: no stage_id (tape carries none; use ?stage=N when a backdrop is deployed)'); }

// register any newly-loaded emitter atlas into the GPU (cockpit pattern, replay.html:renderBodiesPass)
function syncAtlases() {
  if (!SG.ok) return;
  for (const cid in SC.asmChars) {
    const c = SC.asmChars[cid];
    if (c && c.img && !SG.chars[cid]) { SG.setAtlas(cid, c.img); if (c.pal128) SG.setCharPalette(cid, c.pal128); }
    // COSTUME palette-LUT: register the single-bank _idx atlas + its _lut.json so the body
    // draw takes the exact costume-bank path (correct P1/P2/costume colors) instead of the
    // baked-default RGB. Effects (no costume) stay on the RGB atlas above. Once-only per cid.
    if (c && c.idxImg && c.lut && !SG.idxChars[cid]) { SG.setIndexedAtlas(cid, c.idxImg); SG.setCharLUT(cid, c.lut); }
  }
}

function renderFrame(fi) {
  // Effects light ONLY on a 0.3.29 tape (20-byte objs: owner + gfx1/gfx2). On the 0.3.28
  // tape objRecBytes=16 so effectsOn is a no-op (objects[] stays empty). Sprite-class
  // effects render through the emitter pool path -> objectsOn must be true when lit.
  AD.effectsOn = document.getElementById('fx').checked && AD.objRecBytes >= 20;
  SC.objectsOn = AD.effectsOn;                             // §4: pool path draws effects/sats
  SC.hitFlashOn = document.getElementById('hitflash').checked;
  AD.applyFrame(SC, fi, { load: (sc, cid) => sc.loadAsmChar(cid) });
  syncAtlases();

  // ── STAGE backdrop (behind bodies; no-op until an asset is deployed) ──────────
  sctx.clearRect(0, 0, cstage.width, cstage.height);
  const row = AD.frames[fi];
  if (STAGE_ID >= 0 && row) {
    // eyeX/eyeY/ground live at schema idx 20/21/22.
    STAGE.render(sctx, { camX: row[20], camY: row[21], ground: row[22] });
  }

  const drawList = SC.buildAssemblyDrawList(640, 480);
  if (SG.ok) {
    try { SG.render(drawList, {}, null /*no live PVR palette on a tape*/, [], null); }
    catch (e) { log('SG.render: ' + e.message); }
  }
  // ── FULL HUD (portraits + angled bars + names + TIME + meters + combo) ────────
  HUD.renderState(hctx, AD.buildHudState(fi));
  document.getElementById('fno').textContent =
    `idx ${fi} · game ${AD.frames[fi][0]} · parts ${SC._asmDrawn|0} · ${SC._asmNote||''}`;
}

// ── playback — WALL-CLOCK paced (independent of the monitor's refresh rate) ──────
// A tape row is one 60fps game frame. Advance by elapsed-time×speed, NOT one row per
// requestAnimationFrame — that ran at the display's Hz, so a 144Hz panel played 2.4× fast.
const GAME_DT = 1000 / 60;                 // ms of real time per tape frame at 1×
let playing = false, raf = 0, lastT = 0, acc = 0;
function tick(now) {
  if (!playing) return;
  if (!lastT) { lastT = now; raf = requestAnimationFrame(tick); return; }
  const speed = +document.getElementById('speed').value;
  acc += (now - lastT) * speed; lastT = now;
  let fi = +scrub.value, adv = 0;
  while (acc >= GAME_DT) { acc -= GAME_DT; fi++; adv++; if (fi >= AD.frameCount) fi = 0; }
  if (acc > GAME_DT * 4) acc = 0;          // don't spiral to catch up after a tab-away stall
  if (adv) { scrub.value = fi; renderFrame(fi); }
  raf = requestAnimationFrame(tick);
}
document.getElementById('play').onclick = (e) => {
  playing = !playing; e.target.textContent = playing ? '⏸ pause' : '▶ play';
  lastT = 0; acc = 0;
  if (playing) raf = requestAnimationFrame(tick); else cancelAnimationFrame(raf);
};
scrub.oninput = () => { if (!playing) renderFrame(+scrub.value); };
document.getElementById('fx').onchange = () => renderFrame(+scrub.value);
document.getElementById('hitflash').onchange = () => renderFrame(+scrub.value);
document.getElementById('shot').onclick = () => {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const x = c.getContext('2d');
  x.fillStyle = '#181a20'; x.fillRect(0, 0, 640, 480);      // match #stage bg for the no-stage case
  x.drawImage(cstage, 0, 0); x.drawImage(cbody, 0, 0); x.drawImage(hud, 0, 0);
  const a = document.createElement('a');
  a.download = `tape_render_59598061_f${scrub.value}.png`; a.href = c.toDataURL('image/png'); a.click();
};

// first paint (give atlases a moment to lazy-load, then re-render)
renderFrame(+scrub.value);
setTimeout(() => renderFrame(+scrub.value), 400);
setTimeout(() => renderFrame(+scrub.value), 1200);
log('ready. drag the frame slider or press play. effects stay dark by design (see §3).');
</script>
