<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0c12" />
		<meta name="description" content="Marvel vs Capcom 2 — live ranks, tournaments & stats." />
		<script>
			// Steam OpenID returns #token&steamid in the URL fragment. Capture it HERE — inline in the
			// shell head, before any app bundle / route / service worker runs — so sign-in works even
			// when a stale cached SW serves an outdated shell (the return-404 bug). Self-contained +
			// idempotent; the auth store then hydrates from localStorage on boot.
			(function () {
				try {
					var h = location.hash || '';
					if (h.indexOf('token=') === -1) return;
					var p = new URLSearchParams(h.charAt(0) === '#' ? h.slice(1) : h);
					var t = p.get('token'),
						s = p.get('steamid');
					if (t && s && /^\d{17}$/.test(s)) {
						localStorage.setItem('metasync_token', t);
						localStorage.setItem('metasync_steamid', s);
					}
					history.replaceState(null, '', location.pathname + location.search);
				} catch (e) {}
			})();
			// Theme: default DARK (hardcoded on <html> as the no-JS fallback); a saved 'light'/'auto' wins.
			// Runs before first paint → no flash.
			(function () {
				try {
					var t = localStorage.getItem('metasync_theme') || 'dark';
					if (t === 'auto') document.documentElement.removeAttribute('data-theme');
					else document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
